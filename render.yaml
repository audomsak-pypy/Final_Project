services:
  - type: web
    name: adidur
    runtime: python
    plan: free
    rootDir: adidur
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.app:server --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
